/* ============================================================

:root {
  /* Terracotta (primary) */

  /* Ink / warm neutrals */

  --c-error:#B5402F; --c-error-bg:#F6E3DE; --c-info:#2E4636; --c-info-bg:#E7EDE9;

  --brand-secondary:var(--c-forest-500); --brand-secondary-deep:var(--c-forest-700); --brand-accent:var(--c-gold-500);

  /* Typography */

  --container-max:1180px; --container-pad:clamp(20px,5vw,56px); --section-gap:clamp(64px,9vw,128px);

/* ============================================================
   Base element defaults
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-normal);
  color: var(--text-body); background: var(--surface-page);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, h5 {
  font-family: var(--font-display); color: var(--text-strong); font-weight: var(--weight-display);
  line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); margin: 0; text-wrap: balance;
}
h1 em, h2 em, h3 em { font-style: italic; color: var(--brand-primary); }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }
::selection { background: var(--c-gold-300); color: var(--c-ink-900); }
:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; border-radius: var(--radius-xs); }

/* ============================================================
   Marketing site · Boutique Serif edition · class prefix bq-
   ============================================================ */
.bq { background: var(--surface-page); color: var(--text-body); overflow-x: hidden; min-height: 100vh; }
.bq-container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding-inline: var(--container-pad); }
.bq-section { padding-block: clamp(64px, 9vw, 120px); }
.bq-section--tight { padding-block: clamp(40px, 6vw, 72px); }
.bq-rule { height: 1px; background: var(--border-default); border: 0; margin: 0; }

/* buttons */
.bq-btn { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-body); font-weight: 600; font-size: 15px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 14px 26px; cursor: pointer; letter-spacing: -0.005em; white-space: nowrap; transition: transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
.bq-btn svg, .bq-btn i { width: 1.1em; height: 1.1em; }
.bq-btn:active { transform: scale(0.98); }
.bq-btn--p { background: var(--c-ink-900); color: var(--c-bone); }
.bq-btn--p:hover { background: var(--brand-primary); transform: translateY(-2px); }
.bq-btn--o { background: transparent; color: var(--text-strong); border-color: var(--border-strong); }
.bq-btn--o:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
.bq-btn--terra { background: var(--brand-primary); color: var(--c-bone); box-shadow: var(--shadow-brand); }
.bq-btn--terra:hover { background: var(--brand-primary-hover); transform: translateY(-2px); }
.bq-btn--light { background: var(--c-bone); color: var(--c-ink-900); }
.bq-btn--light:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.bq-btn--ghost { background: transparent; color: var(--text-on-dark); border-color: rgba(236,227,212,0.28); }
.bq-btn--ghost:hover { background: rgba(236,227,212,0.08); }
.bq-btn--lg { font-size: 16px; padding: 16px 30px; }
.bq-btn--block { width: 100%; justify-content: center; }

/* eyebrow / labels */
.bq-eye { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand-primary); }
.bq-eye--forest { color: var(--brand-secondary); }
.bq-eye--gold { color: var(--c-gold-600); }
.bq-eye--light { color: var(--c-gold-400); }
.bq-mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }

/* entrance animations */
@keyframes bq-rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes bq-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bq-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bq-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes bq-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes bq-page { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.bq-reveal { animation: bq-rise var(--dur-slow) var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { .bq-reveal { animation: none; } }
.bq-page { animation: bq-page var(--dur-slow) var(--ease-out) both; }

/* page curtain transition */
.bq-curtain { position: fixed; inset: 0; z-index: 5000; background: var(--c-ink-900); transform: scaleY(0); transform-origin: bottom; pointer-events: none; }
.bq-curtain.run { animation: bq-curtain 0.72s var(--ease-in-out) forwards; }
@keyframes bq-curtain { 0% { transform: scaleY(0); transform-origin: bottom; } 46% { transform: scaleY(1); transform-origin: bottom; } 54% { transform: scaleY(1); transform-origin: top; } 100% { transform: scaleY(0); transform-origin: top; } }
.bq-curtain__mark { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; font-family: var(--font-display); font-style: italic; font-size: 44px; color: var(--c-bone); }
.bq-curtain.run .bq-curtain__mark { animation: bq-fade 0.72s ease both; }

/* section header */
.bq-head { max-width: 680px; margin-bottom: var(--space-7); }
.bq-head--center { margin-inline: auto; text-align: center; }
.bq-head h2 { font-size: clamp(34px, 5vw, 56px); margin-top: 16px; font-weight: 500; }
.bq-head p { font-size: 18px; line-height: 1.6; color: var(--text-muted); margin-top: 16px; }

/* logo */
.bq-logo { display: inline-flex; align-items: baseline; gap: 9px; background: none; border: none; padding: 0; cursor: pointer; }
.bq-logo__w { font-family: var(--font-display); font-weight: 500; font-size: 24px; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1; }
.bq-logo__w .d { color: var(--brand-primary); }
.bq-logo__sub { font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-muted); }
.bq-logo--light .bq-logo__w { color: var(--c-bone); }
.bq-logo--light .bq-logo__sub { color: var(--c-gold-400); }

/* nav */
.bq-nav { position: sticky; top: 0; z-index: var(--z-nav); transition: background var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
.bq-nav--scrolled { background: color-mix(in srgb, var(--c-bone) 88%, transparent); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--border-default); }
.bq-nav__inner { display: flex; align-items: center; justify-content: space-between; height: 78px; }
.bq-nav__links { display: flex; align-items: center; gap: 30px; }
.bq-nav__link { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--text-body); background: none; border: none; cursor: pointer; padding: 4px 0; position: relative; }
.bq-nav__link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: var(--brand-primary); transform: scaleX(0); transform-origin: left; transition: transform var(--dur-base) var(--ease-out); }
.bq-nav__link:hover { color: var(--brand-primary); }
.bq-nav__link:hover::after, .bq-nav__link--active::after { transform: scaleX(1); }
.bq-nav__link--active { color: var(--brand-primary); }
.bq-nav__right { display: flex; align-items: center; gap: 14px; }
.bq-burger { display: none; background: none; border: none; cursor: pointer; color: var(--text-strong); width: 42px; height: 42px; place-items: center; }
.bq-burger i { width: 24px; height: 24px; }
@media (max-width: 860px) {
  .bq-nav__links { position: absolute; top: 78px; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; background: var(--surface-card); border-bottom: 1px solid var(--border-default); padding: 8px var(--container-pad) 18px; box-shadow: var(--shadow-lg); display: none; }
  .bq-nav__links--open { display: flex; animation: bq-rise 0.3s var(--ease-out) both; }
  .bq-nav__link { padding: 13px 0; border-bottom: 1px solid var(--border-subtle); }
  .bq-burger { display: grid; }
  .bq-nav__cta-d { display: none; }
}

/* hero */
.bq-hero { padding-top: clamp(40px, 6vw, 80px); padding-bottom: clamp(40px, 6vw, 72px); }
.bq-hero__eye { display: block; }
.bq-hero__top { display: grid; grid-template-columns: 1.5fr 0.95fr; gap: clamp(28px, 5vw, 64px); align-items: end; margin-top: 22px; }
.bq-hero h1 { font-size: clamp(48px, 8vw, 104px); font-weight: 500; letter-spacing: -0.03em; line-height: 0.98; }
.bq-hero h1 em { font-style: italic; color: var(--brand-primary); }
.bq-hero__rt { padding-bottom: 10px; }
.bq-hero__rt p { font-size: 18px; line-height: 1.62; color: var(--text-body); }
.bq-hero__cta { display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
.bq-hero__meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin-top: 56px; padding-top: 30px; border-top: 1px solid var(--border-default); }
.bq-stat__n { font-family: var(--font-display); font-weight: 500; font-size: clamp(34px, 4vw, 48px); letter-spacing: -0.02em; line-height: 1; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.bq-stat__n em { font-style: italic; color: var(--brand-primary); }
.bq-stat__l { font-size: 13px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.01em; }
@media (max-width: 820px) { .bq-hero__top { grid-template-columns: 1fr; align-items: start; } .bq-hero__meta { grid-template-columns: 1fr 1fr; row-gap: 30px; } }

/* hero figure */
.bq-figure { margin-top: 60px; position: relative; }
.bq-mock { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-lg); }
.bq-mock__bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
.bq-mock__grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; margin-top: 18px; }
.bq-mock__ev { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 18px; }
.bq-mock__ev h4 { font-size: 22px; font-weight: 500; margin-top: 8px; }
.bq-chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.bq-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 6px 11px; font-size: 13px; font-weight: 500; color: var(--text-body); }
.bq-mock__swags { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 18px; }
.bq-mock__row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.bq-em { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--surface-card); border: 1px solid var(--border-subtle); display: grid; place-items: center; font-size: 21px; }
.bq-em--more { background: var(--c-ink-900); color: var(--c-bone); border-color: var(--c-ink-900); font-family: var(--font-display); font-style: italic; font-size: 14px; }
.bq-float { position: absolute; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 12px 16px; display: flex; gap: 11px; align-items: center; animation: bq-float 5s var(--ease-in-out) infinite; }
.bq-float--a { top: 38px; left: -22px; }
.bq-float--b { bottom: 34px; right: -22px; animation-delay: 1.4s; }
.bq-float__ic { width: 34px; height: 34px; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 17px; background: var(--surface-brand-soft); }
.bq-float .n { font-family: var(--font-display); font-weight: 500; font-size: 19px; color: var(--text-strong); line-height: 1; }
.bq-float .l { font-size: 11px; color: var(--text-muted); }
@media (max-width: 600px) { .bq-mock__grid { grid-template-columns: 1fr; } .bq-float { display: none; } }

/* marquee */
.bq-marquee { overflow: hidden; padding: 22px 0; border-block: 1px solid var(--border-default); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.bq-marquee__track { display: flex; gap: 54px; width: max-content; animation: bq-marquee 28s linear infinite; }
.bq-marquee__item { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 24px; color: var(--text-faint); white-space: nowrap; display: flex; align-items: center; gap: 16px; }
.bq-marquee__item::after { content: "✦"; font-style: normal; font-size: 11px; color: var(--c-gold-500); }
@media (prefers-reduced-motion: reduce) { .bq-marquee__track { animation: none; } }

/* editorial service list */
.bq-lead { display: grid; grid-template-columns: 1fr 1.3fr; gap: 44px; margin-bottom: 44px; align-items: start; }
.bq-lead h2 { font-size: clamp(32px, 4.6vw, 54px); font-weight: 500; }
.bq-lead p { font-size: 18px; line-height: 1.62; }
.bq-svlist { border-top: 1px solid var(--border-ink); }
.bq-svrow { display: grid; grid-template-columns: 64px 1.1fr 1.6fr 150px; gap: 24px; padding: 30px 0; border-bottom: 1px solid var(--border-default); align-items: start; transition: padding-left var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out); }
.bq-svrow:hover { padding-left: 12px; }
.bq-svrow__no { font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--brand-primary); }
.bq-svrow h3 { font-family: var(--font-display); font-size: 27px; font-weight: 500; }
.bq-svrow__body { font-size: 15px; line-height: 1.6; }
.bq-svrow__tag { font-size: 13px; color: var(--text-muted); text-align: right; letter-spacing: 0.02em; }
.bq-svrow__ic { display: none; }
@media (max-width: 820px) { .bq-svrow { grid-template-columns: 40px 1fr; } .bq-svrow__body, .bq-svrow__tag { grid-column: 2; text-align: left; } .bq-svrow__tag { color: var(--brand-primary); } }

/* steps */
.bq-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--border-ink); }
.bq-step { display: flex; flex-direction: column; align-items: flex-start; padding: 32px 26px 32px 0; border-right: 1px solid var(--border-default); }
.bq-step:last-child { border-right: none; padding-right: 0; }
.bq-step__no { font-family: var(--font-display); font-style: italic; font-size: 20px; color: var(--brand-primary); }
.bq-step__ic { width: 46px; height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); display: grid; place-items: center; color: var(--brand-secondary); margin: 16px 0; flex-shrink: 0; transition: background var(--dur-base), color var(--dur-base), transform var(--dur-base) var(--ease-spring); }
.bq-step__ic i { width: 22px; height: 22px; }

/* ---- count-up ---- */
function setupCountUp() {
  const els = document.querySelectorAll('[data-count]');
  if (!els.length) return;
  if (reduceMotion || !('IntersectionObserver' in window)) { els.forEach(el => el.textContent = el.dataset.count); return; }
  const animate = (el) => {
    const m = String(el.dataset.count).match(/^(\d+)(.*)$/);
    const target = m ? parseInt(m[1], 10) : 0;
    const suffix = m ? m[2] : '';
    let start = null;
    const dur = 1200;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / dur);
      el.textContent = Math.round((1 - Math.pow(1 - p, 3)) * target) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  const io = new IntersectionObserver((ents, obs) => {
    ents.forEach(e => { if (e.isIntersecting) { animate(e.target); obs.unobserve(e.target); } });
  }, { threshold: 0.4 });
  els.forEach(el => io.observe(el));
}

function renderPage() {
  $('#app').innerHTML = (pageBuilders[currentPage] || pageBuilders.home)();
  refreshIcons();
  setupCountUp();
}
function setActiveNav() {
  document.querySelectorAll('.bq-nav__link').forEach(l =>
    l.classList.toggle('bq-nav__link--active', l.dataset.go === currentPage));
}
function go(id) {
  if (!pageBuilders[id]) return;
  closeMobileNav();
  if (id === currentPage) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const curtain = $('#curtain');
  if (reduceMotion) {
    currentPage = id; renderPage(); setActiveNav(); window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    return;
  }
  curtain.classList.add('run');
  setTimeout(() => {
    currentPage = id; renderPage(); setActiveNav(); window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }, 340);
  setTimeout(() => curtain.classList.remove('run'), 780);
}

/* ---- mobile nav ---- */
function closeMobileNav() {
  const links = $('#navLinks'), burger = $('#burger');
  if (links) links.classList.remove('bq-nav__links--open');
  if (burger) { burger.setAttribute('aria-expanded', 'false'); burger.innerHTML = '<i data-lucide="menu"></i>'; refreshIcons(); }
}
function toggleMobileNav() {
  const links = $('#navLinks'), burger = $('#burger');
  const open = links.classList.toggle('bq-nav__links--open');
  burger.setAttribute('aria-expanded', String(open));
  burger.innerHTML = `<i data-lucide="${open ? 'x' : 'menu'}"></i>`;
  refreshIcons();
}

/* ---- global event delegation ---- */
document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }

  if (e.target.closest('#burger')) { toggleMobileNav(); return; }

  const actionEl = e.target.closest('[data-action]');
  if (actionEl && actionEl.dataset.action === 'form-reset') {
    const card = $('#formCard');
    if (card) { card.innerHTML = planFormCardInner(); refreshIcons(); }
    return;
  }

  const catEl = e.target.closest('[data-cat]');
  if (catEl) { swagCat = catEl.dataset.cat; const root = $('#catalogRoot'); if (root) { root.innerHTML = swagCatalogInner(); refreshIcons(); } return; }

  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn) {
    const wrap = qtyBtn.closest('[data-stepper]');
    const id = wrap.dataset.stepper;
    const cur = cart[id] || 0;
    cart[id] = qtyBtn.dataset.qty === 'inc' ? cur + 1 : Math.max(0, cur - 1);
    const root = $('#catalogRoot'); if (root) { root.innerHTML = swagCatalogInner(); refreshIcons(); }
    return;
  }

  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const on = toggle.classList.toggle('bq-toggle--on');
    toggle.setAttribute('aria-pressed', String(on));
    return;
  }

  const acc = e.target.closest('.bq-acc__h');
  if (acc) {
    const item = acc.parentElement;
    const open = item.classList.toggle('bq-acc--open');
    acc.setAttribute('aria-expanded', String(open));
    return;
  }
});

function showFormSuccess() {
  const card = $('#formCard');
  if (card) { card.innerHTML = planSuccessInner(); refreshIcons(); }
}
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'planForm') return;
  e.preventDefault();
  const form = e.target;
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  const name = val('f-full-name');
  const email = val('f-email');
  const eventType = val('s-event-type');
  const attendees = val('s-expected-attendees');
  const city = val('s-city');
  /* native `required` blocks empty submits; guard anyway */
  if (!name || !email || !eventType || !attendees || !city) return;

  const phone = val('f-phone-/-whatsapp');
  const org = val('f-organization');
  const date = val('f-preferred-date');
  const notes = val('f-additional-notes');
  const services = [...form.querySelectorAll('.bq-toggle--on')]
    .map(t => (t.lastElementChild ? t.lastElementChild.textContent : '').trim())
    .filter(Boolean).join(', ') || 'Not specified';
  const selected = D.swags.filter(s => (cart[s.id] || 0) > 0);
  const swagText = selected.length
    ? selected.map(s => `${s.name} ×${cart[s.id]}`).join(', ')
    : 'No swags selected yet';

  const params = {
    from_name: name, from_email: email, phone: phone || 'Not provided',
    organization: org || 'Not provided', event_type: eventType,
    attendees, event_date: date || 'Flexible', city, venue: 'Flexible',
    services, swags: swagText, notes: notes || 'None',
    to_email: 'hello@juicertechnology.com',
  };

  const submitBtn = form.querySelector('button[type="submit"]');
  if (submitBtn) { submitBtn.disabled = true; const sp = submitBtn.querySelector('span'); if (sp) sp.textContent = 'Sending…'; }

  const fallbackMailto = () => {
    const body = `Name: ${name}\nEmail: ${email}\nPhone: ${phone}\nOrg: ${org}\nEvent: ${eventType}\nAttendees: ${attendees}\nDate: ${date}\nCity: ${city}\nServices: ${services}\nSwags: ${swagText}\nNotes: ${notes}`;
    window.location.href = `mailto:hello@juicertechnology.com?subject=${encodeURIComponent('Event Request from ' + name)}&body=${encodeURIComponent(body)}`;
  };

  if (window.emailjs && typeof emailjs.send === 'function') {
    emailjs.send(window.EMAIL_CONFIG.SERVICE_ID, window.EMAIL_CONFIG.TEMPLATE_ID, params)
      .then(showFormSuccess)
      .catch(() => { fallbackMailto(); showFormSuccess(); });
  } else {
    fallbackMailto(); showFormSuccess();
  }
});

/* nav scroll state */
const navEl = $('#nav');
function onScroll() { navEl.classList.toggle('bq-nav--scrolled', window.scrollY > 10); }
window.addEventListener('scroll', onScroll, { passive: true });

/* hash sync (back/forward) */
window.addEventListener('hashchange', () => {
  const h = (location.hash || '#home').slice(1);
  if (pageBuilders[h] && h !== currentPage) { currentPage = h; renderPage(); setActiveNav(); window.scrollTo(0, 0); }
});

/* ---- boot ---- */
try { if (window.emailjs && window.EMAIL_CONFIG) emailjs.init(window.EMAIL_CONFIG.PUBLIC_KEY); } catch (e) {}
renderNav();
renderFooter();
renderPage();
onScroll();
refreshIcons();
</script>
</body>
</html>
